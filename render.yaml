services:
  - type: web
    name: haroondb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 1 --timeout 600
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HAROON_CHECKPOINT
        value: model.pt
